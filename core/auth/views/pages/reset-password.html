<div class="auth-view" id="view-new-password">
  <div class="view-header">
    <h1 class="view-title">New password</h1>
    <p class="view-subtitle">Your email was verified. Create your new password.</p>
  </div>

  <form id="form-new-password" novalidate>
    <div class="form-group">
      <label for="reset-new-password">New password</label>
      <div class="input-wrapper has-toggle">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="reset-new-password" placeholder="At least 8 characters" required autocomplete="new-password">
        <button type="button" class="btn-toggle-password" data-target="reset-new-password" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <span class="field-error" id="error-reset-password"></span>
    </div>

    <div class="form-group">
      <label for="reset-confirm-password">Confirm password</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <input type="password" id="reset-confirm-password" placeholder="Repeat new password" required autocomplete="new-password">
      </div>
      <span class="field-error" id="error-reset-confirm"></span>
    </div>

    <button type="submit" class="btn-primary" id="btn-submit-reset-password">
      <span class="btn-text">Update password &amp; Sign in</span>
      <div class="btn-spinner hidden"></div>
    </button>
  </form>
</div>
