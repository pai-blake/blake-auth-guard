<div class="auth-view" id="view-signup">
  <div class="view-header">
    <span class="view-kicker">START BUILDING IN MINUTES</span>
    <h1 class="view-title">Create your account</h1>
    <p class="view-subtitle">Enter your details to generate your security OTP</p>
  </div>

  <form id="form-signup" novalidate>
    <div class="form-group">
      <label for="signup-name">Full name</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="signup-name" placeholder="Ada Lovelace" required autocomplete="name">
      </div>
      <span class="field-error" id="error-signup-name"></span>
    </div>

    <div class="form-group">
      <label for="signup-email">Email address</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </span>
        <input type="email" id="signup-email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <span class="field-error" id="error-signup-email"></span>
    </div>

    <div class="form-group">
      <label for="signup-password">Password</label>
      <div class="input-wrapper has-toggle">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="signup-password" placeholder="At least 8 characters" autocomplete="new-password" required>
        <button type="button" class="btn-toggle-password" data-target="signup-password" aria-label="Show password">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <span class="field-error" id="error-signup-password"></span>

      <div class="password-strength" id="password-strength-container">
        <div class="strength-bar">
          <div class="strength-fill" id="strength-fill"></div>
        </div>
        <span class="strength-label">Strength: <strong id="strength-text">Empty</strong></span>
        <ul class="strength-rules">
          <li id="rule-length"><span class="rule-dot"></span>8+ chars</li>
          <li id="rule-upper"><span class="rule-dot"></span>Uppercase</li>
          <li id="rule-number"><span class="rule-dot"></span>Number</li>
          <li id="rule-special"><span class="rule-dot"></span>Symbol</li>
        </ul>
      </div>
    </div>

    <div class="form-options">
      <label class="checkbox-wrap">
        <input type="checkbox" id="terms-agree" required>
        <span class="check-box"></span>
        <span>I agree to the <a href="#" class="link">Terms</a> &amp; <a href="#" class="link">Privacy Policy</a></span>
      </label>
      <span class="field-error" id="error-signup-terms"></span>
    </div>

    <button type="submit" class="btn-primary" id="btn-submit-signup">
      <span class="btn-text">Create account</span>
      <div class="btn-spinner hidden"></div>
    </button>
  </form>
</div>
