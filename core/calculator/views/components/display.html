<!-- Calculator Display Screen (Samsung-style: history + expression + result) -->
<div class="calculator-display-wrapper">
  <div class="display-header-row">
    <span class="display-label">Calculator</span>
    <button type="button" id="btn-clear-history" class="btn-clear-history" title="Clear History"
      aria-label="Clear session history">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Clear</span>
    </button>
  </div>
  <div class="calculator-display" id="calculator-display">

    <!-- Scrollable past calculation history (stored in sessionStorage) -->
    <div id="display-history" class="display-history" aria-label="Calculation History"></div>

    <!-- Active calculation area -->
    <div class="display-active-section">
      <!-- Direct Hardware Input + Expression Field -->
      <input type="text" id="display-expression" class="display-expression" placeholder="0" autocomplete="off"
        autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Calculator Expression Input" />

      <!-- Result preview (e.g. = 1,972,800,000) -->
      <div id="display-result" class="display-result" aria-label="Result"></div>
    </div>

  </div>
</div>
