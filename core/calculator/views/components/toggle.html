<!-- Calculator Mode Switcher (Basic ↔ Scientific ↔ Advanced) -->
<div class="calculator-mode-toggle" id="calculator-mode-toggle">
  <button type="button" class="toggle-btn active" data-mode="basic" id="btn-mode-basic">Basic</button>
  <button type="button" class="toggle-btn" data-mode="scientific" id="btn-mode-scientific">Scientific</button>
  <button type="button" class="toggle-btn" data-mode="advanced" id="btn-mode-advanced">Advanced</button>
</div>
