<!-- Basic Calculator View (Page) -->
<div class="calculator-view basic-view active" id="view-basic">
  <!-- Row 1: Clear & Operations -->
  <button type="button" class="calc-btn clear-btn" id="basic-clear" data-action="clear">C</button>
  <button type="button" class="calc-btn delete-btn" id="basic-delete" data-action="delete">DEL</button>
  <button type="button" class="calc-btn operator-btn" data-operator="/">÷</button>
  <button type="button" class="calc-btn operator-btn" data-operator="*">×</button>

  <!-- Row 2: Numbers & Operations -->
  <button type="button" class="calc-btn number-btn" data-number="7">7</button>
  <button type="button" class="calc-btn number-btn" data-number="8">8</button>
  <button type="button" class="calc-btn number-btn" data-number="9">9</button>
  <button type="button" class="calc-btn operator-btn" data-operator="-">−</button>

  <!-- Row 3: Numbers & Operations -->
  <button type="button" class="calc-btn number-btn" data-number="4">4</button>
  <button type="button" class="calc-btn number-btn" data-number="5">5</button>
  <button type="button" class="calc-btn number-btn" data-number="6">6</button>
  <button type="button" class="calc-btn operator-btn" data-operator="+">+</button>

  <!-- Row 4: Numbers & Decimal -->
  <button type="button" class="calc-btn number-btn" data-number="1">1</button>
  <button type="button" class="calc-btn number-btn" data-number="2">2</button>
  <button type="button" class="calc-btn number-btn" data-number="3">3</button>
  <button type="button" class="calc-btn decimal-btn" id="basic-decimal" data-action="decimal">.</button>

  <!-- Row 5: Zero, Square Root & Equals -->
  <button type="button" class="calc-btn number-btn zero-btn" data-number="0">0</button>
  <button type="button" class="calc-btn function-btn" id="basic-sqrt" data-func="sqrt" title="Square Root">√</button>
  <button type="button" class="calc-btn equals-btn" id="basic-equals" data-action="calculate">=</button>
</div>
