<!-- Scientific Calculator View (Page) -->
<div class="calculator-view scientific-view" id="view-scientific">

  <!-- Row 1: Trig + Clear + Delete (6 cols) -->
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-sin" data-func="sin">sin</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-cos" data-func="cos">cos</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-tan" data-func="tan">tan</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-sqrt" data-func="sqrt">√</button>
  <button type="button" class="calc-btn clear-btn sci-sm" id="sci-clear" data-action="clear">C</button>
  <button type="button" class="calc-btn delete-btn sci-sm" id="sci-delete" data-action="delete">DEL</button>

  <!-- Row 2: More functions + operators (6 cols) -->
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-log" data-func="log">log</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-ln" data-func="ln">ln</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-pi" data-const="pi">π</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-euler" data-const="euler">e</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-factorial" data-func="factorial">!</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-percent" data-func="percent">%</button>

  <!-- Row 3: 7 8 9 ^ ÷ × -->
  <button type="button" class="calc-btn number-btn" data-number="7">7</button>
  <button type="button" class="calc-btn number-btn" data-number="8">8</button>
  <button type="button" class="calc-btn number-btn" data-number="9">9</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-power-n" data-func="power-n">xʸ</button>
  <button type="button" class="calc-btn operator-btn" data-operator="/">÷</button>
  <button type="button" class="calc-btn operator-btn" data-operator="*">×</button>

  <!-- Row 4: 4 5 6 x² − + -->
  <button type="button" class="calc-btn number-btn" data-number="4">4</button>
  <button type="button" class="calc-btn number-btn" data-number="5">5</button>
  <button type="button" class="calc-btn number-btn" data-number="6">6</button>
  <button type="button" class="calc-btn function-btn sci-sm" id="sci-power" data-func="power">x²</button>
  <button type="button" class="calc-btn operator-btn" data-operator="-">−</button>
  <button type="button" class="calc-btn operator-btn" data-operator="+">+</button>

  <!-- Row 5: 1 2 3 . 0 = -->
  <button type="button" class="calc-btn number-btn" data-number="1">1</button>
  <button type="button" class="calc-btn number-btn" data-number="2">2</button>
  <button type="button" class="calc-btn number-btn" data-number="3">3</button>
  <button type="button" class="calc-btn decimal-btn sci-sm" id="sci-decimal" data-action="decimal">.</button>
  <button type="button" class="calc-btn number-btn" data-number="0">0</button>
  <button type="button" class="calc-btn equals-btn sci-equals" id="sci-equals" data-action="calculate">=</button>

</div>
