<aside class="calendar-sidebar" id="calendar-sidebar" aria-label="Calendar sidebar">
  <!-- Mini Month Calendar Widget -->
  <div class="sidebar-section mini-calendar-widget">
    <div class="mini-cal-header">
      <h3 class="mini-cal-title" id="mini-cal-title">Month Year</h3>
      <div class="mini-cal-nav">
        <button class="btn-icon-mini" id="mini-cal-prev" title="Previous month" aria-label="Previous month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="btn-icon-mini" id="mini-cal-next" title="Next month" aria-label="Next month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="mini-cal-grid" id="mini-cal-grid">
      <!-- Generated by JavaScript -->
    </div>
  </div>

  <!-- Categories / Calendars Filter -->
  <div class="sidebar-section category-filter-section">
    <div class="section-heading">
      <h4>My Categories</h4>
      <span class="badge-count" id="active-category-label">All</span>
    </div>
    <ul class="category-list" id="category-filter-list">
      <li class="category-item active" data-category="all">
        <span class="cat-dot" style="background: linear-gradient(135deg, #6C63FF, #3B82F6);"></span>
        <span class="cat-name">All Events</span>
        <span class="cat-check">✓</span>
      </li>
      <li class="category-item" data-category="work">
        <span class="cat-dot" style="background: #4F46E5;"></span>
        <span class="cat-name">Work & Projects</span>
        <span class="cat-check"></span>
      </li>
      <li class="category-item" data-category="personal">
        <span class="cat-dot" style="background: #10B981;"></span>
        <span class="cat-name">Personal & Life</span>
        <span class="cat-check"></span>
      </li>
      <li class="category-item" data-category="meeting">
        <span class="cat-dot" style="background: #F59E0B;"></span>
        <span class="cat-name">Meetings & Syncs</span>
        <span class="cat-check"></span>
      </li>
      <li class="category-item" data-category="urgent">
        <span class="cat-dot" style="background: #EF4444;"></span>
        <span class="cat-name">Urgent & High Priority</span>
        <span class="cat-check"></span>
      </li>
      <li class="category-item" data-category="holiday">
        <span class="cat-dot" style="background: #EC4899;"></span>
        <span class="cat-name">Holidays & Birthdays</span>
        <span class="cat-check"></span>
      </li>
    </ul>
  </div>

  <!-- Upcoming Events Section -->
  <div class="sidebar-section upcoming-section">
    <div class="section-heading">
      <h4>Upcoming Soon</h4>
      <span class="badge-count" id="upcoming-events-count">0</span>
    </div>
    <div class="upcoming-list" id="upcoming-events-list">
      <div class="empty-state-mini">No upcoming events scheduled</div>
    </div>
  </div>
</aside>
