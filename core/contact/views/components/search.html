<!-- ───────────────────────────────────────────────────────────────────
     VIEW 1: SEARCH
     ─────────────────────────────────────────────────────────────────── -->
<section class="ct-view active" id="ct-view-search" role="tabpanel" aria-labelledby="tab-search">
  <header class="ct-view-header">
    <div>
      <h2 class="ct-view-heading">Search Directory</h2>
      <p class="ct-view-subheading">Search by name or @username</p>
    </div>
  </header>

  <!-- Search Input Toolbar -->
  <div class="ct-search-bar">
    <div class="ct-search-input-wrap">
      <span class="ct-search-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" id="ct-search-input" class="ct-input"
             placeholder="Search by name or @username..."
             autocomplete="off" autofocus>
      <button type="button" id="ct-search-clear" class="ct-btn-clear" title="Clear search" style="display: none;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Search Results Area -->
  <div class="ct-results-container" id="ct-search-results-area">
    <div class="ct-empty-state" id="ct-search-empty-prompt">
      <div class="ct-empty-icon-wrap">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <h3 class="ct-empty-title">Search Directory</h3>
      <p class="ct-empty-text">Type a name or @username to find contacts.</p>
    </div>

    <div class="ct-cards-grid" id="ct-search-results-grid" style="display: none;">
      <!-- Dynamically populated user cards -->
    </div>

    <div class="ct-loading-spinner" id="ct-search-spinner" style="display: none;">
      <div class="ct-spinner"></div>
      <span>Searching...</span>
    </div>
  </div>
</section>
