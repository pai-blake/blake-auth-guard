<!-- ═══════════════════════════════════════════════════════════
     DELETE ACCOUNT CONFIRMATION MODAL COMPONENT
═══════════════════════════════════════════════════════════════ -->
<div class="hd-modal-overlay hd-hidden" id="hd-delete-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="hd-modal-card">
    <div class="hd-modal-header">
      <div class="hd-modal-icon-wrap">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ef4444" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div>
        <h3 class="hd-modal-title">Delete Account</h3>
        <p class="hd-modal-subtitle">This action is permanent and cannot be undone.</p>
      </div>
    </div>

    <div class="hd-modal-body">
      <p class="hd-modal-desc">
        All your user data, history, and preferences will be permanently erased from the database.
      </p>
      <div class="hd-field-group">
        <label for="hd-delete-password-input" class="hd-field-label">Confirm Password</label>
        <input
          type="password"
          id="hd-delete-password-input"
          class="hd-field-input"
          placeholder="Enter your account password"
          autocomplete="current-password"
        >
      </div>
      <div class="hd-modal-error hd-hidden" id="hd-delete-modal-error"></div>
    </div>

    <div class="hd-modal-actions">
      <button type="button" class="hd-modal-btn hd-modal-btn--cancel" id="hd-delete-modal-cancel">
        Cancel
      </button>
      <button type="button" class="hd-modal-btn hd-modal-btn--danger" id="hd-delete-modal-confirm">
        <span class="hd-btn-text">Permanently Delete</span>
        <span class="hd-spinner hd-hidden"></span>
      </button>
    </div>
  </div>
</div>
